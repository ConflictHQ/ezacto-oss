name: verify
# The quality gates per PROCESS.md: lint, typecheck, test, build — green before
# a merge and green before a deploy. They live here, once, because both callers
# need the same answer and a second copy is a second thing to drift.
#
# One serial `npm run verify` took 34 minutes, of which 29 were tests and 17
# were @ezacto/db alone. The runner has two cores, so raising vitest's worker
# count buys nothing; the only lever is more runners. The gates are therefore
# split across jobs that run at once, and the two suites that dominate are
# sharded further. Same work, a fraction of the wait.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  web-runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: browser security tests on the minimum and storage-regression runtimes
        run: npm exec -w @ezacto/web -- vitest run test/dashboard-browser.test.ts test/browser-storage.test.ts test/node-runtime-contract.test.ts --maxWorkers=2

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-workspace
      - run: npm run typecheck

  # Stdlib guards need no dependency install.
  tracked-symlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: SQL backup and monthly restore safety checks
        run: node --test scripts/restore-drill.test.mjs scripts/monthly-restore-drill.test.mjs
      - name: load-verify gate and shard list match the verify matrix
        run: node --test scripts/load-verify.test.mjs
      - name: Harvest collection adapter refuses unsafe execution
        run: node --test scripts/harvest-postman-read-subset.test.mjs
      - name: Financial access probe refuses unsafe targets and output
        run: node --test scripts/verify-dev-money-isolation.test.mjs
      - name: no tracked symlink points outside the repo or into node_modules
        run: |
          node --test scripts/check-tracked-symlinks.test.mjs
          node scripts/check-tracked-symlinks.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-workspace
      - run: npm run lint
      # D16 rev2 asked for an AA contrast check in CI. It rides the lint job
      # rather than a job of its own: the palette is a handful of hex pairs, so
      # the check is milliseconds, and a runner spent on it would be a runner
      # the five-minute deploy gate has to wait for.
      - name: theme tokens meet WCAG AA
        run: npm run theme:contrast -w @ezacto/web

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-workspace
      - name: contract is what the code emits
        run: npm run contract:check
      - run: npm run build
      - name: install and exercise the packed public CLI outside the workspace
        run: npm run test:package -w @conflict-hq/ezacto-cli
      - name: install and exercise the packed migrate CLI outside the workspace
        run: npm run test:package -w @conflict-hq/ezacto-migrate
      - name: publish versioned OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezacto-openapi-v1-${{ github.sha }}
          path: openapi/ezacto-v1.openapi.json
          if-no-files-found: error

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # D1 cases replay the full migration ledger. Keep every shard/test;
          # schema growth pushed a healthy shard past the old 20-minute job
          # deadline (#745). A bounded 30 minutes leaves completion headroom.
          - { name: db 1, workspaces: -w @ezacto/db, shard: 1/12, timeout_minutes: 30 }
          - { name: db 2, workspaces: -w @ezacto/db, shard: 2/12, timeout_minutes: 30 }
          - { name: db 3, workspaces: -w @ezacto/db, shard: 3/12, timeout_minutes: 30 }
          - { name: db 4, workspaces: -w @ezacto/db, shard: 4/12, timeout_minutes: 30 }
          - { name: db 5, workspaces: -w @ezacto/db, shard: 5/12, timeout_minutes: 30 }
          - { name: db 6, workspaces: -w @ezacto/db, shard: 6/12, timeout_minutes: 30 }
          - { name: db 7, workspaces: -w @ezacto/db, shard: 7/12, timeout_minutes: 30 }
          - { name: db 8, workspaces: -w @ezacto/db, shard: 8/12, timeout_minutes: 30 }
          - { name: db 9, workspaces: -w @ezacto/db, shard: 9/12, timeout_minutes: 30 }
          - { name: db 10, workspaces: -w @ezacto/db, shard: 10/12, timeout_minutes: 30 }
          - { name: db 11, workspaces: -w @ezacto/db, shard: 11/12, timeout_minutes: 30 }
          - { name: db 12, workspaces: -w @ezacto/db, shard: 12/12, timeout_minutes: 30 }
          # reports.test.ts did not finish before the 20-minute limit while
          # sharing two CPUs with general-resources (399s) in run 39658039722.
          # Keep the complete suite; give reports its own worker and partition
          # every other API file across the existing three shards.
          - { name: api 1, workspaces: -w @ezacto/api, shard: 1/3, exclude: test/reports.test.ts, exclude_secondary: test/money-resources.test.ts }
          - { name: api 2, workspaces: -w @ezacto/api, shard: 2/3, exclude: test/reports.test.ts, exclude_secondary: test/money-resources.test.ts }
          - { name: api 3, workspaces: -w @ezacto/api, shard: 3/3, exclude: test/reports.test.ts, exclude_secondary: test/money-resources.test.ts }
          - { name: api reports, workspaces: -w @ezacto/api, filter: test/reports.test.ts, max_workers: 1, timeout_minutes: 30 }
          # The combined money suite exceeded 30m in run40144622189. Run both
          # existing runtime groups separately, retaining every case and the
          # same per-test, worker and job limits.
          - { name: api money SQLite, workspaces: -w @ezacto/api, filter: test/money-resources.test.ts, test_name_pattern: 'money resource API [(]SQLite[)]', max_workers: 1, timeout_minutes: 30 }
          - { name: api money D1, workspaces: -w @ezacto/api, filter: test/money-resources.test.ts, test_name_pattern: 'money resource API [(]D1[)]', max_workers: 1, timeout_minutes: 30 }
          - { name: migrate, workspaces: -w @conflict-hq/ezacto-migrate }
          # One worker, not two. The worker suite's two-factor and backup-download
          # tests derive passwords through the isolate's KDF limiter, and two
          # files deriving at once on a two-vCPU runner overflow its queue
          # (PasswordDerivationOverloadedError, #745). Each file passes alone.
          - { name: worker, workspaces: -w ezacto-worker, max_workers: 1, timeout_minutes: 30 }
          # Six files that npm run verify has always covered and this matrix
          # never did, so the merge gate was weaker than the deploy gate.
          - { name: container, workspaces: -w ezacto-container }
          # This matrix names its workspaces explicitly, so a new package is
          # NOT covered by being in the `packages/*` glob -- it has to be added
          # here or its suite never runs in CI, silently. @ezacto/integrations
          # arrived with 17 tests that would have been invisible.
          - {
              name: packages,
              workspaces: -w @ezacto/core -w @conflict-hq/ezacto-client -w @ezacto/mailer -w @conflict-hq/ezacto-cli -w @ezacto/mcp -w @ezacto/integrations,
            }
          # The only suite that drives a browser, so the only one that pays for
          # Chromium.
          # Run 40047697593 exhausted 20m after 659s of passing unit tests
          # and only 52/91 native cases. Keep the complete suite and its assertions.
          - { name: web, workspaces: -w @ezacto/web, playwright: 'true', timeout_minutes: 30 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-workspace
        with:
          playwright: ${{ matrix.playwright || 'false' }}
      - name: test
        env:
          WORKSPACES: ${{ matrix.workspaces }}
          # The dedicated job runs the same four cases concurrently. Local verify keeps them.
          EZACTO_SKIP_CONTROL_STYLE_AUDIT: ${{ matrix.name == 'web' && '1' || '' }}
          SHARD: ${{ matrix.shard }}
          TEST_FILTER: ${{ matrix.filter }}
          TEST_NAME_PATTERN: ${{ matrix.test_name_pattern }}
          TEST_EXCLUDE: ${{ matrix.exclude }}
          TEST_EXCLUDE_SECONDARY: ${{ matrix.exclude_secondary }}
          MAX_WORKERS: ${{ matrix.max_workers || 2 }}
          # apps/web's browser suite mounts the whole shell about eighty times
          # and retains roughly 28 MB per test -- measured and linear, so it
          # needs over two gigabytes to finish. A developer machine gives it
          # that by default and a two-vCPU runner does not, which showed up as
          # `test (web)` reporting 464 of 471 tests with nothing having failed,
          # the fork having died partway through the file. Here for the same
          # reason the worker count is: it is a property of the runner. It
          # raises a ceiling rather than fixing the leak, which is #456.
          #
          # NODE_OPTIONS rather than vitest's poolOptions.forks.execArgv, which
          # does not reach the fork -- setting a 300 MB limit there changed
          # nothing, while the same limit in NODE_OPTIONS killed the run.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          # pipefail so tee does not hide a red suite; the log is what the
          # annotation step below classifies (issue 745).
          set -o pipefail
          # Two vCPUs on ubuntu-latest, so two workers. This belongs to the
          # runner, not to a package.json: the same suite on a developer
          # machine should use the cores it has.
          test_args=(--maxWorkers="$MAX_WORKERS")
          if [ -n "$SHARD" ]; then test_args+=(--shard="$SHARD"); fi
          if [ -n "$TEST_FILTER" ]; then test_args+=("$TEST_FILTER"); fi
          if [ -n "$TEST_NAME_PATTERN" ]; then test_args+=(--testNamePattern="$TEST_NAME_PATTERN"); fi
          if [ -n "$TEST_EXCLUDE" ]; then test_args+=(--exclude "$TEST_EXCLUDE"); fi
          if [ -n "$TEST_EXCLUDE_SECONDARY" ]; then test_args+=(--exclude "$TEST_EXCLUDE_SECONDARY"); fi
          npm test $WORKSPACES -- "${test_args[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: classify the failure against the ledger
        if: failure()
        run: node scripts/ci-failure-ledger.mjs --classify "$RUNNER_TEMP/test.log" --job "test (${{ matrix.name }})"

  control-style-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-workspace
        with:
          playwright: 'true'
      - name: build the native browser fixture
        run: npm run browser:prepare -w @ezacto/web
      - name: audit all four control-style scenarios
        run: npm run controls:audit -w @ezacto/web -- --output test-results
      - name: retain owned control-style audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-style-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/control-style-guard*/*.png
            apps/web/test-results/control-style-guard*/control-style-observations.json
          if-no-files-found: warn
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the scan reads commits, not just the working tree, so
          # a secret added and later removed on the same branch is still caught
          fetch-depth: 0
      - uses: ./.github/actions/node-workspace
      - name: gitleaks (E12 — secrets never in git)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar -xz gitleaks

          # Self-test: a gate that cannot detect this repo's own secret shape is
          # decoration. gitleaks' default ruleset has no keyword for "PAT", so
          # HARVEST_PAT=<token> scans clean without .gitleaks.toml. The canary is
          # generated here and never committed.
          canary="${RUNNER_TEMP:-/tmp}/gitleaks-canary.env"
          printf 'HARVEST_PAT=%s\n' "1234567.pt.$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 64)" > "$canary"
          if ./gitleaks dir "$canary" --config .gitleaks.toml --redact --no-banner; then
            blind=1
          else
            blind=0
          fi
          rm -f "$canary"
          if [ "$blind" = 1 ]; then
            echo "::error::gitleaks no longer detects a Harvest PAT — the E12 gate is blind"
            exit 1
          fi

          # Scan the complete ancestry of the checked-out PR merge or main HEAD,
          # not unrelated remote branch tips that checkout also fetched. This
          # still catches a secret added and later deleted anywhere in the
          # history being proposed for merge.
          ./gitleaks git . --log-opts="--full-history --diff-merges=first-parent --diff-filter=tuxdb HEAD" --config .gitleaks.toml --redact --no-banner --verbose
        env:
          GITLEAKS_VERSION: 8.30.0

  container:
    runs-on: ubuntu-latest
    # 30, because this job started finishing at 20m18s and the ceiling was 20.
    # GitHub cancels the job at the ceiling, a cancelled job fails the run, and
    # `deploy` runs only after `verify` -- so three consecutive production
    # deployments were skipped by a build that was merely slow. Raising a budget
    # is not usually a fix, and it is not one here either: the job builds a
    # Docker image, runs first-run, then a physical backup and restore, and it
    # has grown into its old limit rather than regressed into it. The ceiling
    # buys room while the build itself is made faster.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A fresh runner has no layer cache, so the dependency layer the
      # Dockerfile now keeps across a source edit would still be rebuilt every
      # run. buildx is what lets the test reach the Actions cache; the test
      # itself decides whether to use it, and falls back to a plain build off
      # CI.
      - uses: docker/setup-buildx-action@v3
      - name: exercise first-run and physical backup/restore
        run: npm run test:container
