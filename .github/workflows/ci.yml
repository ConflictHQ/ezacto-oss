name: ci
# The merge gate. Successful verification attests the exact tested merge tree.
# Deployment reuses that receipt instead of repeating the suite on main.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  # A second push supersedes the first on a branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  # One check for branch protection to require: green only when every verify
  # job succeeded. A cancelled or skipped matrix job is not green.
  green:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = "success"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify the deployment source gate
        run: node --test scripts/verified-source.test.mjs
      - name: Attest the source tree that passed verification
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFIED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          VERIFIED_SOURCE_FILE: ${{ runner.temp }}/verified-source.json
        run: node scripts/verified-source.mjs attest
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source
          path: ${{ runner.temp }}/verified-source.json
          if-no-files-found: error
          retention-days: 90
