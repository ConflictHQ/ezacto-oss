name: ci
# Quality gates per PROCESS.md: lint, typecheck, test — green before merge.
# Scaffolded before the first package on purpose: the pipeline is proven,
# and expands automatically as workspaces land (scripts use --if-present).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the gitleaks step below scans commits, not just the
          # working tree, so a secret added and later removed on the same branch
          # is still caught
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: install Chromium for browser acceptance
        run: npx playwright install --with-deps --only-shell chromium
      - name: verify (typecheck + lint + test)
        run: npm run verify
      - name: publish versioned OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezacto-openapi-v1-${{ github.sha }}
          path: openapi/ezacto-v1.openapi.json
          if-no-files-found: error
      - name: gitleaks (E12 — secrets never in git)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar -xz gitleaks

          # Self-test: a gate that cannot detect this repo's own secret shape is
          # decoration. gitleaks' default ruleset has no keyword for "PAT", so
          # HARVEST_PAT=<token> scans clean without .gitleaks.toml. The canary is
          # generated here and never committed.
          canary="${RUNNER_TEMP:-/tmp}/gitleaks-canary.env"
          printf 'HARVEST_PAT=%s\n' "1234567.pt.$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 64)" > "$canary"
          if ./gitleaks dir "$canary" --config .gitleaks.toml --redact --no-banner; then
            blind=1
          else
            blind=0
          fi
          rm -f "$canary"
          if [ "$blind" = 1 ]; then
            echo "::error::gitleaks no longer detects a Harvest PAT — the E12 gate is blind"
            exit 1
          fi

          # Scan the complete ancestry of the checked-out PR merge or main HEAD,
          # not unrelated remote branch tips that checkout also fetched. This
          # still catches a secret added and later deleted anywhere in the
          # history being proposed for merge.
          ./gitleaks git . --log-opts="--full-history --diff-filter=tuxdb HEAD" --config .gitleaks.toml --redact --no-banner
        env:
          GITLEAKS_VERSION: 8.30.0
