name: ci
# The merge gate. The gates themselves live in verify.yml so that this and the
# deploy run the identical definition.
#
# No push trigger: on main the deploy runs the same verify.yml before it ships,
# so a second copy here would only buy a duplicate 21-job run of work already
# being done in the run that matters.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  # A second push supersedes the first on a branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  # One check for branch protection to require: green only when every verify
  # job succeeded. A cancelled or skipped matrix job is not green.
  green:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = "success"
