name: publish-npm

# Publishes @conflict-hq/ezacto-client, @conflict-hq/ezacto-cli and @conflict-hq/ezacto-migrate to npm
# from a tag of the form npm-v<version>, where <version> must equal all three package versions. Needs the
# NPM_TOKEN secret (an automation token from the npm account that owns the
# @ezacto scope); without it the job stops before touching the registry.
on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/npm-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#npm-v}"
          for p in packages/client packages/cli packages/migrate; do
            v="$(node -p "require('./$p/package.json').version")"
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag" >&2; exit 1; }
          done
      - run: npm run build -w @ezacto/core -w @ezacto/integrations -w @ezacto/db -w @conflict-hq/ezacto-client -w @conflict-hq/ezacto-cli -w @conflict-hq/ezacto-migrate
      - run: npm test -w @conflict-hq/ezacto-client -w @conflict-hq/ezacto-cli
      - name: install and exercise release tarballs before publishing any package
        run: |
          npm run test:package -w @conflict-hq/ezacto-cli
          npm run test:package -w @conflict-hq/ezacto-migrate
      - name: Refuse to publish without a token
        run: test -n "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @conflict-hq/ezacto-client --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @conflict-hq/ezacto-cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @conflict-hq/ezacto-migrate --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
