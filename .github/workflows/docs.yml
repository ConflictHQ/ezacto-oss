name: docs

# ezacto.dev is built from the repository's own documents and contract, so it
# follows main: every merge that touches a source of the site republishes it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "RESTORE.md"
      - "CONTRIBUTING.md"
      - "openapi/**"
      - "packages/cli/README.md"
      - "entries/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test -w ezacto-docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: entries/docs
          command: deploy
