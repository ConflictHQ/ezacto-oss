# gitleaks config for ezacto-oss — E12 ("secrets never in git") is only a gate if
# it detects the secrets this repo actually handles.
#
# gitleaks' default generic-api-key rule keys off nearby keywords
# (token/key/secret/access/auth/password). "PAT" is not one of them, so a
# committed `HARVEST_PAT=<token>` line scans clean under the default ruleset —
# and a Harvest PAT has no documented expiry and reaches every Harvest account
# its owner belongs to. The rules below close that gap; ci.yml self-tests them
# against a freshly generated canary, so a config that stops matching fails CI
# instead of silently going blind.

title = "ezacto-oss"

[extend]
useDefault = true

[[rules]]
id = "harvest-pat"
description = "Harvest personal access token"
# Harvest PATs are <account-digits>.pt.<long random string>
regex = '''\b[0-9]{4,12}\.pt\.[A-Za-z0-9_\-]{32,}'''
keywords = [".pt."]

[[rules]]
id = "harvest-pat-assignment"
description = "HARVEST_PAT assigned a literal value"
# Format-independent backstop: any non-empty HARVEST_PAT value in the tree.
# `.dev.vars.example` ships the key with an empty value, which does not match.
# [ \t]* not \s*: \s matches newlines, so `HARVEST_PAT=` followed by a blank value
# and then any long variable name on the next line matched the "value" group. That
# made .dev.vars.example — which ships the key deliberately empty — a permanent
# false positive, and a gate that cries wolf gets switched off.
regex = '''(?i)\bharvest_pat\b[ \t]*[:=][ \t]*['"]?([A-Za-z0-9._\-]{16,})['"]?'''
keywords = ["harvest_pat"]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Deterministic invoice reference token used by the mutation-guard test"
condition = "AND"
regexTarget = "line"
regexes = ['''reference_token = 'EZ-123456789ABC' WHERE id = 1''']
paths = ['''^packages/db/test/invoice-import-contract\.test\.ts$''']

# A DNS challenge-token fixture was committed as a 43-character base64url
# literal, which is indistinguishable from a real key and rightly tripped this
# rule. HEAD no longer contains it -- the fixture is composed from its parts --
# but the gate scans --full-history, and history is not rewritten here.
#
# Scoped to the one commit that carries it rather than to the file: a path
# allowlist would excuse whatever that test file holds next, which is how a
# secrets gate stops being one. This entry cannot cover a future leak, because
# a future leak is a different commit.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Composed away in HEAD; this is the historical blob only"
condition = "AND"
commits = ["70547af8abd60d6a08b60ea6afc45ecd16c6a54e"]
paths = ['''^packages/api/test/sso-domains\.test\.ts$''']

# TOTP secrets are base32, 32 characters, and high-entropy by construction, so
# generic-api-key cannot tell a standards-body test vector from a real one. The
# two below are not secrets in any sense: they base32-decode to the ASCII
# strings "12345678901234567890" -- the RFC 6238 test seed every TOTP
# implementation is checked against -- and "abcdefghijklmnopqrst".
#
# Allowlisted by VALUE rather than by path, following the invoice-token entry
# above. A path rule would excuse whatever those test files hold next, which is
# how a secrets gate stops being one; these regexes cannot excuse anything but
# these two exact strings, in any file, forever.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "RFC 6238 TOTP test vectors — decode to 12345678901234567890 and abcdefghijklmnopqrst"
condition = "OR"
regexTarget = "line"
regexes = [
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''MFRGGZDFMZTWQ2LKNNWG23TPOBYXE43U''',
]
