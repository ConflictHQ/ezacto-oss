# gitleaks config for ezacto-oss — E12 ("secrets never in git") is only a gate if
# it detects the secrets this repo actually handles.
#
# gitleaks' default generic-api-key rule keys off nearby keywords
# (token/key/secret/access/auth/password). "PAT" is not one of them, so a
# committed `HARVEST_PAT=<token>` line scans clean under the default ruleset —
# and a Harvest PAT has no documented expiry and reaches every Harvest account
# its owner belongs to. The rules below close that gap; ci.yml self-tests them
# against a freshly generated canary, so a config that stops matching fails CI
# instead of silently going blind.

title = "ezacto-oss"

[extend]
useDefault = true

[[rules]]
id = "harvest-pat"
description = "Harvest personal access token"
# Harvest PATs are <account-digits>.pt.<long random string>
regex = '''\b[0-9]{4,12}\.pt\.[A-Za-z0-9_\-]{32,}'''
keywords = [".pt."]

[[rules]]
id = "harvest-pat-assignment"
description = "HARVEST_PAT assigned a literal value"
# Format-independent backstop: any non-empty HARVEST_PAT value in the tree.
# `.dev.vars.example` ships the key with an empty value, which does not match.
# [ \t]* not \s*: \s matches newlines, so `HARVEST_PAT=` followed by a blank value
# and then any long variable name on the next line matched the "value" group. That
# made .dev.vars.example — which ships the key deliberately empty — a permanent
# false positive, and a gate that cries wolf gets switched off.
regex = '''(?i)\bharvest_pat\b[ \t]*[:=][ \t]*['"]?([A-Za-z0-9._\-]{16,})['"]?'''
keywords = ["harvest_pat"]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Deterministic invoice reference token used by the mutation-guard test"
condition = "AND"
regexTarget = "line"
regexes = ['''reference_token = 'EZ-123456789ABC' WHERE id = 1''']
paths = ['''^packages/db/test/invoice-import-contract\.test\.ts$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Test-fixture API keys in Mailgun provider unit tests"
fingerprints = [
  "2c6b98a95969c24cb6177f12fd0436d3a0ef7e99:packages/mailer/test/mailgun.test.ts:generic-api-key:5",
  "2c6b98a95969c24cb6177f12fd0436d3a0ef7e99:packages/mailer/test/mailgun.test.ts:generic-api-key:57",
]
